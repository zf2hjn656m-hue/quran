<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>رفيق القرآن 🤍</title>
<style>
  :root{--bg:#f7f3ea;--card:#fffdf8;--ink:#2f2a23;--muted:#7a7065;--line:#e7dfd2;--accent:#7b6a4d}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",Arial,sans-serif}
  .wrap{max-width:760px;margin:auto;padding:22px 16px 40px}
  header{text-align:center;padding:10px 0 18px}.brand{font-size:28px;font-weight:700}.sub{color:var(--muted);margin-top:6px}
  .resume{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:10px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .resume b{display:block;margin-bottom:4px}.resume span{font-size:14px;color:var(--muted)}
  button{border:0;border-radius:12px;padding:11px 15px;font:inherit;cursor:pointer;background:var(--accent);color:white}
  button.secondary{background:#eee7db;color:var(--ink)}
  .page{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px 20px;min-height:420px}
  .pagehead{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}
  .ayah{font-family:"Amiri","Noto Naskh Arabic","Scheherazade New",serif;font-size:27px;line-height:2.15;margin:0 0 18px;text-align:justify}
  .ayahnum{font-family:Arial,sans-serif;font-size:14px;color:var(--accent);white-space:nowrap}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.nav button{flex:1}
  .tools{display:flex;gap:8px;margin-top:10px}.tools button{flex:1}
  .status{text-align:center;color:var(--muted);font-size:13px;margin:14px 0}
  .source{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}.source a{color:inherit}
  .loading{text-align:center;padding:80px 10px;color:var(--muted)}
  .error{text-align:center;padding:50px 10px;color:#8a3d32}
  input{width:90px;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;font:inherit;background:white}
  .jump{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
  @media(max-width:520px){.ayah{font-size:24px;line-height:2}.page{padding:20px 14px}.brand{font-size:25px}}
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand">رفيق القرآن 🤍</div>
    <div class="sub">اقرأ من حيث توقفت</div>
  </header>

  <section class="resume" aria-live="polite">
    <div>
      <b id="resumeTitle">بسم الله نبدأ</b>
      <span id="resumeText">هذا الـNFC مخصص لهذه القراءة.</span>
    </div>
    <button id="resumeBtn" type="button">متابعة</button>
  </section>

  <section id="reader" class="page">
    <div class="loading">جاري فتح القرآن…</div>
  </section>

  <div class="nav">
    <button id="prev" class="secondary" type="button">السابق</button>
    <button id="next" type="button">التالي</button>
  </div>

  <div class="jump">
    <span>اذهب إلى صفحة</span>
    <input id="pageInput" type="number" min="1" max="604" value="1" aria-label="رقم الصفحة">
    <button id="go" class="secondary" type="button">فتح</button>
  </div>

  <div class="tools">
    <button id="save" class="secondary" type="button">🔖 حفظ موضعي الآن</button>
    <button id="reset" class="secondary" type="button">بدء من الصفحة 1</button>
  </div>

  <div id="status" class="status"></div>

  <div class="source">
    نص القرآن من Al Quran Cloud. يحافظ التطبيق على النص كما يقدمه المصدر.
    <br><a href="https://alquran.cloud/" target="_blank" rel="noopener">alquran.cloud</a>
  </div>
</main>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const tag = (params.get("tag") || "demo").replace(/[^a-zA-Z0-9_-]/g, "").slice(0,60) || "demo";
  const key = "quran_nfc_last_page_" + tag;

  let page = Number(localStorage.getItem(key) || 1);
  if (!Number.isInteger(page) || page < 1 || page > 604) page = 1;

  const reader = document.getElementById("reader");
  const status = document.getElementById("status");
  const input = document.getElementById("pageInput");
  const resumeTitle = document.getElementById("resumeTitle");
  const resumeText = document.getElementById("resumeText");
  const resumeBtn = document.getElementById("resumeBtn");

  function savePage(p) {
    page = Math.max(1, Math.min(604, Math.round(Number(p) || 1)));
    localStorage.setItem(key, String(page));
    input.value = page;
    resumeTitle.textContent = "آخر موضع محفوظ";
    resumeText.textContent = `صفحة ${page} من 604`;
    status.textContent = `تم حفظ موضعك: الصفحة ${page}`;
  }

  function setLoading() {
    reader.innerHTML = '<div class="loading">جاري تحميل الصفحة…</div>';
  }

  async function loadPage(p, shouldSave=true) {
    p = Math.max(1, Math.min(604, Math.round(Number(p) || 1)));
    setLoading();
    try {
      const res = await fetch(`https://api.alquran.cloud/v1/page/${p}/quran-uthmani`);
      if (!res.ok) throw new Error("API error");
      const json = await res.json();
      const data = json.data;
      const ayahs = data.ayahs || [];

      const title = ayahs.length && ayahs[0].surah ? ayahs[0].surah.name : "القرآن الكريم";
      reader.innerHTML = `
        <div class="pagehead">المصحف الشريف · صفحة ${data.number} · ${title}</div>
        ${ayahs.map(a => `
          <p class="ayah">${escapeHtml(a.text)} <span class="ayahnum">﴿${toArabicDigits(a.numberInSurah)}﴾</span></p>
        `).join("")}
      `;
      if (shouldSave) savePage(p);
      else { page=p; input.value=p; status.textContent=`الصفحة ${p} من 604`; }
      window.scrollTo({top:0, behavior:"smooth"});
    } catch(e) {
      reader.innerHTML = '<div class="error">تعذر تحميل الصفحة الآن. تأكدي من اتصال الإنترنت ثم اضغطي إعادة المحاولة.</div>';
      const retry = document.createElement("button");
      retry.textContent = "إعادة المحاولة";
      retry.onclick = () => loadPage(p, true);
      reader.appendChild(retry);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  }
  function toArabicDigits(n){
    return String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
  }

  document.getElementById("prev").onclick = () => { if(page>1) loadPage(page-1); };
  document.getElementById("next").onclick = () => { if(page<604) loadPage(page+1); };
  document.getElementById("go").onclick = () => loadPage(input.value);
  input.addEventListener("keydown", e => { if(e.key==="Enter") loadPage(input.value); });
  document.getElementById("save").onclick = () => savePage(page);
  document.getElementById("reset").onclick = () => { if(confirm("هل تريدين بدء القراءة من الصفحة الأولى؟")) loadPage(1); };
  resumeBtn.onclick = () => loadPage(Number(localStorage.getItem(key) || 1));

  resumeTitle.textContent = "آخر موضع محفوظ";
  resumeText.textContent = `صفحة ${page} من 604 · هذا الرابط: ${tag}`;
  input.value = page;
  loadPage(page, false);
})();
</script>
</body>
</html>
