<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رفيق القرآن</title>
<style>
  :root{--bg:#f4efe4;--card:#fffdf8;--ink:#4b3a25;--gold:#9b7a45;--line:#e5dac6}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
  body{min-height:100vh}
  .wrap{max-width:760px;margin:auto;padding:12px 10px 24px}
  header{text-align:center;padding:8px 0 10px}
  h1{font-size:22px;margin:0 0 3px;font-weight:700}
  .sub{font-size:13px;color:#8c7b63}
  .reader{background:#eee4cf;border:1px solid #d9cbb1;border-radius:10px;overflow:hidden;box-shadow:0 5px 22px rgba(66,47,23,.10)}
  .mushaf{display:block;width:100%;height:auto;min-height:300px;background:#f8f1df}
  .loading{padding:80px 15px;text-align:center;color:#8c7b63}
  .err{padding:40px 15px;text-align:center;color:#8b3c2f;line-height:1.8}
  .controls{background:var(--card);padding:10px;border-radius:0 0 12px 12px}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;margin:7px 0}
  button,input{font:inherit}
  button{border:0;border-radius:12px;background:var(--gold);color:white;padding:11px 18px;font-weight:600}
  button.secondary{background:#eee6d8;color:var(--ink)}
  button:disabled{opacity:.45}
  .pageNo{min-width:90px;text-align:center;font-weight:700}
  .jump{display:flex;gap:7px;justify-content:center;align-items:center}
  input{width:85px;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:white}
  .saved{font-size:12px;color:#8c7b63;text-align:center;margin-top:5px}
  .source{font-size:11px;color:#9a8b76;text-align:center;margin-top:12px}
  .source a{color:#80633a}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>رفيق القرآن 🤍</h1>
    <div class="sub">اقرأ من حيث توقفت</div>
  </header>

  <main class="reader" id="reader">
    <div class="loading">جاري فتح صفحة القرآن…</div>
  </main>

  <section class="controls">
    <div class="row">
      <button id="prev">السابق</button>
      <div class="pageNo" id="pageLabel">صفحة 1 من 604</div>
      <button id="next">التالي</button>
    </div>
    <div class="jump">
      <span>اذهب إلى</span>
      <input id="pageInput" type="number" min="1" max="604" inputmode="numeric">
      <button class="secondary" id="open">فتح</button>
    </div>
    <div class="row">
      <button class="secondary" id="reset">بدء من الصفحة 1</button>
      <button class="secondary" id="save">حفظ موضعي الآن 🔖</button>
    </div>
    <div class="saved" id="saved"></div>
  </section>

  <div class="source">
    صفحات المصحف المعروضة هي صفحات مصحف مصوّرة، وليست نصاً معاد تنسيقه.
    <br>
    <a href="https://www.mp3quran.net/" target="_blank" rel="noopener">مصدر صفحات المصحف</a>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const tag = params.get("tag") || "default";
  const storageKey = "quran_nfc_last_page_" + tag;
  const TOTAL = 604;

  const reader = document.getElementById("reader");
  const pageLabel = document.getElementById("pageLabel");
  const pageInput = document.getElementById("pageInput");
  const saved = document.getElementById("saved");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  const openBtn = document.getElementById("open");
  const saveBtn = document.getElementById("save");
  const resetBtn = document.getElementById("reset");

  let page = Math.min(TOTAL, Math.max(1, parseInt(localStorage.getItem(storageKey) || "1",10) || 1));
  let startX = null;

  function pageUrl(p){
    return "https://www.mp3quran.net/api/quran_pages_svg/" + String(p).padStart(3,"0") + ".svg";
  }

  function savePage(p){
    page = Math.min(TOTAL, Math.max(1,p));
    localStorage.setItem(storageKey, String(page));
    saved.textContent = "تم حفظ الصفحة " + page + " لهذا الـNFC";
  }

  function loadPage(p, autoSave=true){
    page = Math.min(TOTAL, Math.max(1,p));
    pageLabel.textContent = "صفحة " + page + " من " + TOTAL;
    pageInput.value = page;
    prev.disabled = page === 1;
    next.disabled = page === TOTAL;

    reader.innerHTML = "";
    const img = document.createElement("img");
    img.className = "mushaf";
    img.alt = "صفحة " + page + " من المصحف الشريف";
    img.src = pageUrl(page);
    reader.appendChild(img);

    img.onerror = () => {
      reader.innerHTML = '<div class="err">تعذر تحميل صفحة المصحف الآن.<br>تأكدي من اتصال الإنترنت ثم حاولي مرة أخرى.</div>';
    };

    if(autoSave) savePage(page);
    window.scrollTo({top:0,behavior:"smooth"});
  }

  prev.onclick = () => { if(page>1) loadPage(page-1); };
  next.onclick = () => { if(page<TOTAL) loadPage(page+1); };
  openBtn.onclick = () => {
    const p = parseInt(pageInput.value,10);
    if(p>=1 && p<=TOTAL) loadPage(p);
  };
  saveBtn.onclick = () => savePage(page);
  resetBtn.onclick = () => { loadPage(1); };

  pageInput.addEventListener("keydown", e => {
    if(e.key === "Enter") openBtn.click();
  });

  reader.addEventListener("touchstart", e => { startX = e.changedTouches[0].clientX; }, {passive:true});
  reader.addEventListener("touchend", e => {
    if(startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 55){
      // RTL reading: swipe left -> next, swipe right -> previous
      if(dx < 0 && page < TOTAL) loadPage(page+1);
      if(dx > 0 && page > 1) loadPage(page-1);
    }
    startX = null;
  }, {passive:true});

  loadPage(page, false);
  saved.textContent = "هذا التاق: " + tag + " · آخر صفحة محفوظة: " + page;
})();
</script>
</body>
</html>
