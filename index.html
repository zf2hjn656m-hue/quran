<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>المصحف</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#f7f1e3;overflow:hidden}
  #app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
  #page{max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f7f1e3;color:#6f624f;font-family:-apple-system,BlinkMacSystemFont,"Geeza Pro",Arial,sans-serif;font-size:18px}
  #error{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;color:#6f624f;font-family:-apple-system,BlinkMacSystemFont,"Geeza Pro",Arial,sans-serif;font-size:17px;line-height:1.8}
</style>
</head>
<body>
<div id="app">
  <img id="page" alt="صفحة من المصحف" draggable="false">
</div>
<div id="loading">جاري تحميل الصفحة…</div>
<div id="error">تعذر تحميل صفحة المصحف.<br>تأكدي من اتصال الإنترنت ثم أعيدي فتح الرابط.</div>
<script>
(() => {
  const TOTAL = 604;
  const params = new URLSearchParams(location.search);
  const tag = (params.get('tag') || '001').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,50) || '001';
  const key = 'quran_nfc_last_page_' + tag;
  let page = Number(localStorage.getItem(key) || 1);
  if (!Number.isInteger(page) || page < 1 || page > TOTAL) page = 1;

  const img = document.getElementById('page');
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');

  // KSU Ayat scanned Madinah Mushaf page images. Page 1..604.
  const urlFor = p => `https://quran.ksu.edu.sa/ayat/safahat1/${p}.png`;

  function show(p, push=true){
    p = Math.max(1, Math.min(TOTAL, p));
    page = p;
    loading.style.display = 'flex';
    error.style.display = 'none';
    img.style.visibility = 'hidden';
    img.onload = () => {
      loading.style.display = 'none';
      img.style.visibility = 'visible';
      localStorage.setItem(key, String(page));
      if (push) history.replaceState(null,'',`${location.pathname}?tag=${encodeURIComponent(tag)}`);
    };
    img.onerror = () => {
      loading.style.display = 'none';
      error.style.display = 'flex';
    };
    img.src = urlFor(page);
  }

  let startX=0,startY=0,startTime=0;
  document.addEventListener('touchstart', e => {
    const t=e.changedTouches[0]; startX=t.clientX; startY=t.clientY; startTime=Date.now();
  }, {passive:true});
  document.addEventListener('touchend', e => {
    const t=e.changedTouches[0];
    const dx=t.clientX-startX, dy=t.clientY-startY, dt=Date.now()-startTime;
    if (Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.2 && dt<700) {
      // RTL reading: swipe left -> next page, swipe right -> previous page.
      show(page + (dx < 0 ? 1 : -1));
    }
  }, {passive:true});

  // Also allow tapping the left/right side without adding visible controls.
  document.addEventListener('click', e => {
    if (window.getSelection && String(window.getSelection()).length) return;
    const x=e.clientX/window.innerWidth;
    if (x < .22) show(page-1);
    else if (x > .78) show(page+1);
  });

  show(page,false);
})();
</script>
</body>
</html>
